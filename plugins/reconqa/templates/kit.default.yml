# ReconQA plugin defaults. Do not edit this file in the plugin.
# Override any key in your project's .reconqa/kit.yml (team) or .reconqa/kit.local.yml (personal).
# Maps are merged key by key; lists replace the default list.

version: 1

app:
  url: null                       # set in your kit.yml, e.g. http://localhost:3000
  target: web                     # what is under test; only web works today (android, api, mqtt, serial: after launch)
  environments: []
  extra_origins: []              # other origins the app calls from the browser, e.g. http://localhost:3101 for a separate API
  auth:
    browser_state: .reconqa/auth/state.json   # saved, already-logged-in browser state (gitignored)
    test_accounts: []             # allowlist; empty = the agent does not log in
    on_mfa_prompt: stop
  test_data:
    allow_create: false           # explore may sign up users / add records only if true; never on production
    prefix: reconqa               # every created name/email/title starts with this, e.g. reconqa-7f3a@example.test
    email_domain: example.test    # reserved domain, never delivers mail
  deny_actions:                   # never performed, even if asked; judged by effect, not by button label
    - change passwords, credentials, API keys or tokens
    - change security settings (MFA, SSO, permissions, roles)
    - make payments or enter payment details
    - delete accounts or bulk-delete data
    - solve or bypass a CAPTCHA

capabilities:
  tracker:
    tool: none                    # detected at setup: github-issues if connected
    server_prefix: null
    repo: null
  test_management:
    tool: csv
    path: qa/cases
  docs:
    tool: local
    path: qa/docs
  comms:
    tool: markdown
    path: qa/reports
  app_driver:
    tool: playwright
    server_prefix: mcp__playwright__

output:
  atlas: qa/atlas
  cases: qa/cases
  bugs: qa/bugs
  reports: qa/reports
  runs: qa/runs
  kb: qa/kb                       # feature knowledge base: decisions, known issues, coverage
  sources: qa/sources             # imported manuals and old cases (copied once, then cited)
  language: en
  commit_screenshots: false

kb:
  token_cap: 4000                 # most tokens for one feature's decisions + known issues (loaded with every ticket)

explore:
  token_budget: 150000            # best effort: the model estimates; not enforced
  max_steps: 80                   # best effort; measured runs used 56-70 tool steps
  screenshots: evidence-only
  settle_ms: 1500

cases:
  format: steps-table
  required_fields: [title, preconditions, steps, expected, priority]
  id_pattern: "TC-{area}-{n:03}"
  priority_scale: [High, Medium, Low]
  max_steps: 8
  max_expected: 4
  step_numbers_in_expected: false
  release_label_in_text: false
  unseen_text: generic
  skip_unrunnable: true
  add_new_on_update: false
  ui_string_markup: guillemets

run:
  screenshots: failures          # failures | every-step
  max_cases: 25                   # best effort: ask before running more in one go
  recheck_failures: true          # repeat a failed step once before calling it failed
  stop_after_failures: 0          # 0 = run everything

bugs:
  fields: [title, environment, version, preconditions, steps, expected, actual, evidence, severity]
  severity_scale: [Critical, Major, Minor, Trivial]
  labels: [bug]
  required_evidence: [steps, expected, actual, screenshot, version, environment]
  version_source: live

tracker_policy:
  assignee: never
  filing: draft-only
  verify_cited_ids: true

words:
  banned: []
  glossary: {}

rules: []

guardrails:
  require_approval: true
  deny_deletes: true
  deny_shell_tracker_writes: true
